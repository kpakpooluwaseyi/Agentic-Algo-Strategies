# Redis 8.0 Configuration for RBI Swarm — Dell Executor
# Architecture Decision D2: AOF everysec persistence, 4GB memory cap
# DO NOT change maxmemory or appendfsync without architecture review.

# === Memory ===
maxmemory 4gb
maxmemory-policy allkeys-lru

# === Persistence — AOF only (Decision D2) ===
# Disable RDB snapshots entirely; rely solely on AOF
save ""
appendonly yes
# 1s max data loss — acceptable within 2.5s tick-to-trade SLA (NFR1)
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-rewrite-incremental-fsync yes

# === Network ===
# Loopback + Tailscale IP for Mac connectivity
bind 127.0.0.1 100.71.18.71
port 6379
protected-mode yes
timeout 0
tcp-keepalive 300

# === Stream Configuration ===
# Streams used:  stream:strategy_ready, stream:heartbeat
# Consumer groups: mac_validator, dell_executor
stream-node-max-bytes 4096
stream-node-max-entries 100

# === Logging ===
loglevel notice
logfile ""

# === Performance ===
hz 20
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# === Security ===
# requirepass — set via environment or keyring; do not hardcode here
# rename-command FLUSHALL ""   # Uncomment in production to prevent accidental flush
# rename-command CONFIG ""     # Uncomment to lock down config changes
